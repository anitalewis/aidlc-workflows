name: Debug collector (temporary)
# DEBUG ONLY: never merged. Runs the Windows collector cases on windows-latest.
on:
  push:
    branches: [debug/collector-retained-reparse]
permissions:
  contents: read
jobs:
  collector:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun scripts/package.ts
      - run: bun tests/run-tests.ts --e2e --no-llm --filter '^t-windows-live-provisioning$'
